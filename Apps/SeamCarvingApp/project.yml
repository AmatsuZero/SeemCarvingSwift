name: SeamCarvingApp

options:
  bundleIdPrefix: com.seamcarving
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  SeamCarvingSwift:
    path: ../..

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SeamCarvingApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
    dependencies:
      - package: SeamCarvingSwift
        product: SeamCarvingApple
      - package: SeamCarvingSwift
        product: SeamCarvingCore
      - package: SeamCarvingSwift
        product: SeamCarvingVision
    settings:
      base:
        PRODUCT_NAME: SeamCarving
        PRODUCT_MODULE_NAME: Shared
        PRODUCT_BUNDLE_IDENTIFIER: com.seamcarving.ios
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Seam Carving
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  SeamCarvingAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SeamCarvingApp
      - package: SeamCarvingSwift
        product: SeamCarvingApple
      - package: SeamCarvingSwift
        product: SeamCarvingCore
      - package: SeamCarvingSwift
        product: SeamCarvingVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seamcarving.app-tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SeamCarving.app/SeamCarving"
        BUNDLE_LOADER: "$(TEST_HOST)"

  SeamCarvingAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SeamCarvingApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seamcarving.app-ui-tests

schemes:
  SeamCarvingApp:
    build:
      targets:
        SeamCarvingApp: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: SeamCarvingAppTests
        - name: SeamCarvingAppUITests
