name: Android Gradle library

on:
  pull_request:
    paths:
      - 'Android/**'
      - 'Sources/SeamCarvingAndroidBridge/**'
      - 'Sources/SeamCarvingCore/**'
      - 'Tests/SeamCarvingAndroidBridgeTests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/android-library.yml'
  push:
    branches: [main]
    tags: ['android-v*']
    paths:
      - 'Android/**'
      - 'Sources/SeamCarvingAndroidBridge/**'
      - 'Sources/SeamCarvingCore/**'
      - 'Tests/SeamCarvingAndroidBridgeTests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/android-library.yml'

permissions:
  contents: read

env:
  SWIFT_VERSION: '6.3.3'
  SWIFT_ANDROID_SDK: 'swift-6.3.3-RELEASE_android'
  SWIFT_ANDROID_SDK_URL: 'https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz'
  SWIFT_ANDROID_SDK_SHA256: 'd160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5'
  ANDROID_NDK_VERSION: '27.3.13750724'
  ANDROID_COMPILE_SDK: '35'
  ANDROID_EMULATOR_API: '35'
  # The native-library convention maps these exact triples to the three
  # release ABI directories; keep this list visible in CI review.
  PUBLISHED_SWIFT_TRIPLES: 'aarch64-unknown-linux-android28,armv7-unknown-linux-android28,x86_64-unknown-linux-android28'

jobs:
  library:
    name: ABI, device, and Maven consumer gate
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      # AGP 8.10 and the pinned Gradle 8.14 wrapper run on JDK 17. Keep this
      # in lockstep with the checked-in Android build rather than relying on
      # a newer runner JDK that the wrapper cannot execute on.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # setup-swift v3 installs Swiftly, so Gradle can enforce the same pinned
      # toolchain that developers use locally.
      - name: Set up pinned Swift through Swiftly
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.3.3'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK, emulator, and NDK
        run: |
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?android-actions/setup-android did not set an SDK root}}"
          sdkmanager --install \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-${ANDROID_EMULATOR_API};google_apis;x86_64" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_SDK_ROOT=${android_sdk_root}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${android_sdk_root}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache Swift packages and Android native build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm/cache
            ~/.swiftpm/swift-sdks
            ~/.cache/swiftly
            .build
            Android/.gradle
            Android/**/build
          key: ${{ runner.os }}-android-swift-${{ env.SWIFT_VERSION }}-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('Package.resolved', 'Android/gradle/libs.versions.toml', 'Android/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-android-swift-${{ env.SWIFT_VERSION }}-${{ env.ANDROID_NDK_VERSION }}-

      - name: Install and configure the pinned Swift Android SDK
        run: |
          swiftly run swift +${SWIFT_VERSION} sdk install "${SWIFT_ANDROID_SDK_URL}" --checksum "${SWIFT_ANDROID_SDK_SHA256}"
          swiftly run swift +${SWIFT_VERSION} sdk list | grep -Fx "${SWIFT_ANDROID_SDK}"
          "${HOME}/.swiftpm/swift-sdks/${SWIFT_ANDROID_SDK}.artifactbundle/swift-android/scripts/setup-android-sdk.sh"

      - name: Verify the Swift bridge and all published ABIs
        working-directory: Android
        run: |
          cd ..
          swiftly run swift +${SWIFT_VERSION} test --filter SeamCarvingAndroidBridgeTests
          cd Android
          ./gradlew --no-daemon :seamcarving-android-core:verifySwiftAndroidToolchain
          ./gradlew --no-daemon :seamcarving-android-core:assembleRelease :seamcarving-android-core:testReleaseUnitTest
          ./gradlew --no-daemon :seamcarving-android-bitmap:assembleRelease :seamcarving-android-bitmap:testReleaseUnitTest
          ./gradlew --no-daemon :seamcarving-android-mlkit:assembleRelease :seamcarving-android-mlkit:testReleaseUnitTest
          ./gradlew --no-daemon :seamcarving-android:testReleaseUnitTest

      - name: Run Android device and Maven-only consumer tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            cd Android
            ./gradlew --no-daemon \
              :seamcarving-android-core:connectedDebugAndroidTest \
              :seamcarving-android-bitmap:connectedDebugAndroidTest \
              :seamcarving-android-mlkit:connectedDebugAndroidTest \
              publishAllPublicationsToBuildRepository \
              :sample:connectedDebugAndroidTest \
              verifyExternalMavenSample \
              :seamcarving-android-core:verifyExternalMavenConsumer

      - name: Upload Android test and publication diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-library-diagnostics
          path: |
            Android/**/build/reports
            Android/**/build/outputs
            Android/build/local-maven
          if-no-files-found: ignore

      - name: Preserve the verified tag publication graph
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: actions/upload-artifact@v4
        with:
          name: android-local-maven-${{ github.ref_name }}
          path: Android/build/local-maven
          if-no-files-found: error

  release-publication-gate:
    name: Tag-only local Maven release gate
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: library
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - name: Download the ABI/device/consumer-verified Maven graph
        uses: actions/download-artifact@v4
        with:
          name: android-local-maven-${{ github.ref_name }}
          path: Android/build/local-maven
      - name: Verify the tag has all public POMs before remote release handoff
        working-directory: Android
        run: |
          VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          test -n "${VERSION_NAME}"
          test -f build/local-maven/io/github/seamcarving/seamcarving-android/${VERSION_NAME}/seamcarving-android-${VERSION_NAME}.pom
          test -f build/local-maven/io/github/seamcarving/seamcarving-android-mlkit/${VERSION_NAME}/seamcarving-android-mlkit-${VERSION_NAME}.pom

# This workflow deliberately performs no remote Maven upload and reads no
# publishing credentials. A separately reviewed release workflow must consume
# the verified artifact graph and add signing/remote-repository credentials.
