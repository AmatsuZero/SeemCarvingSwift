name: Core portability

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        # setup-swift supports macOS and Ubuntu; Windows is not supported.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      # macos-latest already supplies the Swift toolchain that matches its Xcode SDK.
      - uses: swift-actions/setup-swift@v2
        if: matrix.os == 'ubuntu-latest'
        with:
          swift-version: '6.0'
      - run: bash Scripts/check-target-boundaries.sh
      - run: swift build --target SeamCarvingCore
      - run: swift build --target SeamCarvingCLIModel
      - run: swift build --target SeamCarvingCLIArguments
      - run: swift build --target SeamCarvingCLIOrchestration
      # swift test builds all test targets, including Apple-framework targets on Linux.
      - run: swift build --target SeamCarvingCoreTests
      - run: swift test --filter SeamCarvingCoreTests
        if: matrix.os == 'macos-latest'

  apple-cli:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - run: bash Scripts/check-target-boundaries.sh
      - run: swift build --product seamcarve-cli
      - run: |
          SEAMCARVE_CLI_PATH="$(swift build --show-bin-path)/seamcarve-cli" \
            swift test --filter SeamCarvingAppleCLITests
